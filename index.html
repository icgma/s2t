<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>s2t — 简繁转换</title>
<meta name="description" content="简体、繁体（台湾/香港）互转，支持地区词汇差异。全部在浏览器本地运行，稿件不上传。" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <a class="back" href="https://icgma.github.io/newsroom-kit/" title="返回工具箱">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M10.3 3.3 5.6 8l4.7 4.7 1.4-1.4L8.4 8l3.3-3.3-1.4-1.4Z"/></svg>
      </a>
      <span class="dot" aria-hidden="true"></span>
      <span class="wordmark">s2t</span>
      <span class="tag">简繁转换</span>
    </div>
    <div class="topbar-right">
      <span class="privacy" title="所有转换都在你的浏览器里完成">
        <svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 1 2 3v5c0 4 2.5 6.5 6 7.5 3.5-1 6-3.5 6-7.5V3L8 1Zm0 2 4 1.3v3.7c0 3-1.8 4.9-4 5.6-2.2-.7-4-2.6-4-5.6V4.3L8 3Z"/></svg>
        稿件不上传
      </span>
      <button class="theme-toggle" id="themeToggle" title="切换主题">
        <svg class="ico-moon" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M6.5 2A6 6 0 0 0 8 13.9 6 6 0 0 1 6.5 2Zm2.8-.9a7.5 7.5 0 1 0 5.6 9.3 6 6 0 0 1-5.6-9.3Z"/></svg>
        <svg class="ico-sun" viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-8.5V.8m0 14.4v-1.7m3.9-9.6 1.2-1.2M2.9 13.1l1.2-1.2m0-7.8L2.9 2.9m10.2 10.2-1.2-1.2M13.5 8h1.7M.8 8h1.7"/></svg>
        <span id="themeLabel">浅色</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" aria-label="转换方向">
      <div class="nav-group">
        <div class="nav-group-title">发稿方向</div>
        <button class="nav-item active" data-preset="cn2twp">简 → 繁（台湾）</button>
        <button class="nav-item" data-preset="cn2hk">简 → 繁（香港）</button>
        <button class="nav-item" data-preset="cn2tw">简 → 繁（通用字）</button>
        <button class="nav-item" data-preset="twp2cn">繁（台湾）→ 简</button>
        <button class="nav-item" data-preset="hk2cn">繁（香港）→ 简</button>
      </div>
      <div class="nav-group">
        <div class="nav-group-title">其他</div>
        <button class="nav-item" data-preset="tw2hk">繁（台）→ 繁（港）</button>
        <button class="nav-item" data-preset="hk2tw">繁（港）→ 繁（台）</button>
        <button class="nav-item" data-preset="jp2cn">日本新字体 → 简</button>
      </div>
      <div class="side-note">
        <strong>台湾</strong>与<strong>香港</strong>不只是字形差异，还包含用词习惯（软件/軟體、网络/網路）。选“通用字”只换字形，不换词。
      </div>
    </nav>

    <main class="main">
      <div class="main-head">
        <div class="main-title">
          <h1 id="presetName">简 → 繁（台湾）</h1>
          <p id="presetDesc">转换字形并套用台湾用词习惯，适合发往台湾媒体的稿件。</p>
        </div>
        <div class="main-controls">
          <div class="options">
            <label class="opt"><input type="checkbox" id="optHighlight" checked />标出改动</label>
            <label class="opt"><input type="checkbox" id="optQuotes" />直角引号「」</label>
          </div>
        </div>
      </div>

      <div class="panes">
        <section class="pane">
          <div class="pane-head">
            <label for="input">原文</label>
            <div class="pane-actions">
              <button class="iconbtn" data-act="sample" title="填入示例">示例</button>
              <button class="iconbtn" data-act="paste" title="粘贴">粘贴</button>
              <button class="iconbtn" data-act="clear-input" title="清空">清空</button>
            </div>
          </div>
          <textarea id="input" spellcheck="false" placeholder="粘贴稿件，转换结果实时出现在右侧。" aria-label="原文"></textarea>
          <div class="pane-foot"><span id="inputCount">0 字</span></div>
        </section>

        <div class="swap-wrap">
          <button class="swap" id="swapBtn" title="反向转换" aria-label="反向转换">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M5 2v8.6L2.7 8.3 1.3 9.7 6 14.4l4.7-4.7-1.4-1.4L7 10.6V2H5Zm9 12V5.4l2.3 2.3 1.4-1.4L13 1.6 8.3 6.3l1.4 1.4L12 5.4V14h2Z"/></svg>
          </button>
        </div>

        <section class="pane">
          <div class="pane-head">
            <label for="output">译文</label>
            <div class="pane-actions">
              <button class="iconbtn" data-act="copy" title="复制结果">复制</button>
            </div>
          </div>
          <div class="output-wrap">
            <div id="outputView" class="output-view" aria-live="polite"></div>
            <textarea id="output" spellcheck="false" readonly aria-label="译文" hidden></textarea>
          </div>
          <div class="pane-foot"><span id="outputCount">0 字</span></div>
        </section>
      </div>

      <div class="statusbar">
        <span id="status" class="status ready">加载字典…</span>
        <span class="hint" id="hint"></span>
      </div>
    </main>
  </div>

  <footer class="footer">
    <div class="footer-meta">
      <span>Built with <strong>GLM-5.2</strong></span>
      <span class="sep desktop-only">·</span>
      <span class="desktop-only">作者 <span class="footer-author">icgma</span></span>
      <span class="sep">·</span>
      <a href="https://github.com/icgma/s2t" target="_blank" rel="noopener">源码</a>
    </div>
    <div class="footer-meta">
      <span class="desktop-only">字典来自 OpenCC · 本地运行</span>
    </div>
  </footer>
</div>
<script src="vendor/opencc-full.min.js"></script>
<script src="app.js"></script>
</body>
</html>
